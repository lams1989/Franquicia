version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT}:27017"
    restart: always
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "bash", "/docker-entrypoint-initdb.d/mongo-healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 5

  franquicia-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MONGO_USER: ${MONGO_USER}
        MONGO_PASS: ${MONGO_PASS}
        MONGO_DB: ${MONGO_DB}
        MONGO_HOST: ${MONGO_HOST}
        SERVER_PORT: ${SERVER_PORT}
    container_name: franquicia-api
    ports:
      - "${SERVER_PORT}:8080"
    env_file:
      - .env
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}?retryWrites=true&w=majority
    depends_on:
      mongo:
        condition: service_healthy
    restart: on-failure
